<style>
/* ==================================================================
   SOLFORMØRKELSES-MISSIONEN

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#080b1a;color:#f2f4fa;overflow-x:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
/* Blødt lysskær bag indholdet */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 65% at 50% -10%, rgba(255,196,110,.16), transparent 62%),
    radial-gradient(95% 55% at 50% 108%, rgba(88,120,220,.16), transparent 60%);
}
#stjerner{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 44px;min-height:100%}

h1{font-size:31px;line-height:1.12;letter-spacing:-.7px;margin-bottom:10px;
  background:linear-gradient(180deg,#fff,#c8d0e8);-webkit-background-clip:text;
  background-clip:text;color:transparent}
h2{font-size:24px;line-height:1.2;margin-bottom:8px;letter-spacing:-.3px}
p{font-size:18.5px;line-height:1.55;color:#c9d0e2}
.lille{font-size:15px;color:#98a1bf;line-height:1.5}

.kort.voksenkort{
  background:linear-gradient(165deg,rgba(255,138,112,.17),rgba(255,110,90,.06));
  border-color:rgba(255,150,125,.26);
  box-shadow:0 10px 30px rgba(90,20,10,.25), inset 0 1px 0 rgba(255,255,255,.08)}
.kort{
  background:linear-gradient(165deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:19px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(8px);
}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:#ffd68a;
  background:linear-gradient(180deg,rgba(255,209,102,.2),rgba(255,209,102,.08));
  border:1px solid rgba(255,209,102,.28);border-radius:99px;padding:6px 14px;margin-bottom:13px}
.knap{position:relative;display:block;width:100%;border:0;border-radius:17px;padding:17px 20px;
  font-size:18px;font-weight:700;font-family:inherit;color:#191203;overflow:hidden;
  background:linear-gradient(135deg,#ffdc8b,#ffab4d);cursor:pointer;margin-top:11px;
  transition:transform .12s,box-shadow .2s;
  box-shadow:0 8px 24px rgba(255,159,69,.3), inset 0 1px 0 rgba(255,255,255,.45)}
.knap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  transform:translateX(-120%);transition:transform .7s}
.knap:active{transform:scale(.975);box-shadow:0 4px 14px rgba(255,159,69,.26)}
.knap:active::after{transform:translateX(120%)}
.knap.sekundaer{background:rgba(255,255,255,.045);color:#c6cde0;
  border:1.5px solid rgba(255,255,255,.16);box-shadow:none;font-size:16px;font-weight:600}
.skjul{display:none !important}

.top{display:flex;align-items:center;gap:11px;margin-bottom:18px;padding-top:6px}
.bar{position:relative;flex:1;height:9px;background:rgba(255,255,255,.09);
  border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffd166,#ff9f45);transition:width .6s cubic-bezier(.4,1.3,.5,1);
  box-shadow:0 0 12px rgba(255,180,80,.6)}
.stjernetal{font-size:16px;font-weight:800;color:#ffd68a;white-space:nowrap;
  text-shadow:0 0 14px rgba(255,200,90,.35)}


/* ---------- Forsiden ---------- */
.forside{text-align:center;padding:6px 0 4px}
.hero{position:relative;width:min(74vw,270px);aspect-ratio:1;margin:0 auto 4px}
.hero svg{width:100%;height:100%;overflow:visible}
.hero .glod{transform-box:fill-box;transform-origin:center;

.hero .hmaane{animation:maanetur 11s ease-in-out infinite}
@keyframes maanetur{

  100% {transform:translate(125px,-26px)}
}
@keyframes glodpuls{

/* ---------- Filmsekvens: tekstslide -> video -> videre ---------- */
.slide{display:flex;flex-direction:column;align-items:center;justify-content:center;

/* Videoplads */
.videoslot{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;

/* Tegneserie — lodret stribe, så hver rude fylder hele skærmbredden */
.billedslot{position:relative;width:100%;border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);

.billedslot img{display:block;width:100%;height:auto}
.billedslot .ph{display:none;padding:26px 20px;text-align:center}
.billedslot.fejl{border-style:dashed;border-color:rgba(255,255,255,.2);box-shadow:none}
.billedslot.fejl .ph{display:block}
.billedslot .ikon{font-size:30px;margin-bottom:8px;opacity:.5}
.billedslot .txt{font-size:13px;color:#8e97b5;line-height:1.45}
.ruder{position:absolute;inset:0;pointer-events:none}
.stribe{border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.12);
  box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px;background:#0a1024}
.pnl{position:relative;width:100%;aspect-ratio:1000/592;background-repeat:no-repeat;
  border-bottom:1px solid rgba(0,0,0,.6)}
.pnl:last-child{border-bottom:0}
.pnl svg{display:block;width:100%;height:100%}
.pnl img.egen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pnl .rude{top:auto;bottom:0;height:52%}
.billedslot.fejl .ruder{display:none}
.rude{position:absolute;left:0;right:0;display:flex;align-items:flex-end;padding:0 11px 9px;

  text-shadow:0 1px 5px rgba(0,0,0,.85)}
.rude b{flex:none;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;
  background:#ffd166;color:#1a1204;font-size:12px;font-weight:800;text-shadow:none}

.valg{display:grid;gap:11px;margin-top:15px}
.valg button{position:relative;width:100%;text-align:left;font-family:inherit;font-size:17.5px;
  font-weight:600;color:#f2f4fa;line-height:1.35;padding:17px 19px;cursor:pointer;
  background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.04));

.valg button:active{transform:scale(.985);border-color:rgba(255,214,138,.5)}

.valg button.rigtigt{

.valg button.rigtigt::after{content:"\2713";position:absolute;right:16px;top:50%;

.feedback{margin-top:15px;padding:16px 18px;border-radius:18px;font-size:17px;line-height:1.55;

  color:#f6ead0;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.feedback b{color:#ffd68a}

#scene{position:relative;width:100%;aspect-ratio:1/1;max-height:min(58vh,420px);cursor:grab;
  border-radius:22px;overflow:hidden;margin-bottom:12px;touch-action:none;

#scene svg{position:absolute;inset:0;width:100%;height:100%}
#hjaelp{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;

  white-space:nowrap;pointer-events:none;transition:opacity .3s}
.maalere{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.maaler{background:rgba(255,255,255,.06);border-radius:14px;padding:11px 8px;text-align:center}
.maaler .v{font-size:21px;font-weight:800;color:#ffd166;line-height:1.1}

.ting{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}

<script>
/* ==================================================================
   1) VIDEOER
   ------------------------------------------------------------------
   Læg dine fem videoer i mappen "videos/" med præcis disse filnavne,
   så finder spillet dem selv. Mangler en fil, viser spillet i stedet
   en kort beskrivelse — spillet virker fint uden videoerne.

   Vil du hellere bruge YouTube, så skriv et embed-link i stedet, fx:
   intro: "https://www.youtube.com/embed/XXXXXXXXXXX"
   ================================================================== */
const VIDEOER = {
  intro:    "videos/sol1.mp4",
  kina:     "videos/Kina.mp4",       // dragen der spiser solen
  krig:     "videos/krig.mp4",       // slaget der gik i stå
  pige:     "videos/pige.mp4",       // pigen der drømmer sig ud i rummet   // Månen glider ind foran solen
  historie: "videos/sol2.mp4",   // Ulven Sköll bider i solen
  maane:    "videos/sol3.mp4",   // Set fra rummet: månens skygge rammer Jorden
  moerke:   "videos/dyrsover.mp4",  // fuglene bliver stille   // Fuglene bliver stille, lyset bliver gråt
  sikker:   "videos/sol5.mp4"    // Barn tager solformørkelsesbriller på
};

/* ==================================================================
   1b) TEGNESERIER
   ------------------------------------------------------------------
   Læg dine tegneserie-billeder i mappen "billeder/" med disse navne.
   Hvert felt er ÉT billede — enten en hel stribe i én fil, eller et
   billede du selv har sat sammen af 3-5 ruder.
   Mangler filen, viser spillet en tekstbeskrivelse i stedet.
   ================================================================== */
const BILLEDER = {
  lysrejse: {
    fil: "billeder/tegneserie1.jpg",     // én stribe med 4 ruder

(function(){
  const c = document.getElementById('stjerner'), x = c.getContext('2d');
  let s = [];
  function nyt(){
    c.width = innerWidth; c.height = innerHeight;
    s = Array.from({length:90}, () => ({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.4+.3, f:Math.random()*Math.PI*2, h:Math.random()*.02+.005
    }));
  }
  function tegn(){
    x.clearRect(0,0,c.width,c.height);
    for(const p of s){
      p.f += p.h;
      x.globalAlpha = .25 + Math.abs(Math.sin(p.f))*.6;
      x.fillStyle = '#fff';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    requestAnimationFrame(tegn);
  }
  nyt(); tegn(); addEventListener('resize', nyt);
})();

let lyd = null;
function bip(hz, laengde, type){
  try{
    lyd = lyd || new (window.AudioContext||window.webkitAudioContext)();
    const o = lyd.createOscillator(), g = lyd.createGain();
    o.type = type || 'sine'; o.frequency.value = hz;
    o.connect(g); g.connect(lyd.destination);
    g.gain.setValueAtTime(.09, lyd.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, lyd.currentTime + laengde);
    o.start(); o.stop(lyd.currentTime + laengde);
  }catch(e){}
}

/* ================================================================
   FILMSEKVENS
   Tryk på "Videre" -> kort tekstslide (ca. 3,5 sek) -> videoen kører
   alene uden knapper -> når den er slut, glider den selv videre.
   ================================================================ */
let sekvensId = 0;        // så gamle timere ikke forstyrrer
let forberedtVideo = null;

function stopVideo(){
  const v = forberedtVideo;
  if(v){ try{ v.pause(); v.muted = true; v.removeAttribute('src'); v.load(); }catch(e){} }
  document.querySelectorAll('video').forEach(x => { try{ x.pause(); }catch(e){} });
  forberedtVideo = null;
}

function videoSekvens(noegle, tekst, naeste){
  const mit = ++sekvensId;
  stopVideo();                          // en tidligere video må aldrig køre videre
  forberedtVideo = null;

  // Videoen laves med det samme, mens brugerens tryk stadig "tæller",
  // så den må starte af sig selv bagefter — også på iPhone.
  const kilde = VIDEOER[noegle];
  if(kilde && /\.(mp4|webm|mov|m4v)(\?|$)/i.test(kilde)){
    const v = document.createElement('video');
    v.src = kilde; v.preload = 'auto';
    v.playsInline = true; v.setAttribute('playsinline','');
    v.muted = true;                     // lydløs mens den varmes op — ellers slipper der lyd ud
    const p = v.play();
    if(p && p.then) p.then(() => { v.pause(); v.currentTime = 0; }).catch(() => {});
    forberedtVideo = v;
  }

  tekstSlide(mit, tekst, () => filmen(mit, naeste));
}

function tekstSlide(mit, tekst, naar){
  const tid = 3600;
  vis(`
    <div class="slide" id="slide">
      <p class="slidetxt">${tekst}</p>
      <div class="slidebar" style="--tid:${tid}ms"><i></i></div>
    </div>
  `);
  const gaa = () => {
    if(mit !== sekvensId) return;
    const el = document.getElementById('slide');
    if(el) el.classList.add('udtoning');
    setTimeout(() => { if(mit === sekvensId) naar(); }, 380);
  };
  setTimeout(gaa, tid);
  // Utålmodig? Tryk hvor som helst for at springe teksten over
  setTimeout(() => {
    const el = document.getElementById('slide');
    if(el) el.addEventListener('click', gaa, {once:true});
  }, 400);
}

function filmen(mit, naeste){
  const v = forberedtVideo;
  const videre = () => {
    if(mit !== sekvensId) return;
    sekvensId++;                       // stop alt andet i denne sekvens
    try{ v.pause(); }catch(e){}
    const r = document.getElementById('film');
    if(r) r.classList.add('udtoning');
    setTimeout(naeste, 380);
  };

  if(!v){ return videre(); }           // ingen videofil — gå bare videre

  vis(`<div class="filmramme" id="film"></div>
       <button class="spring" onclick="springOver()">Spring over →</button>`);
  document.getElementById('film').appendChild(v);
  v.controls = false;
  v.addEventListener('ended', videre);
  v.addEventListener('error', videre);
  window.springOver = videre;

  v.muted = false;                     // nu må den godt larme
  const kør = v.play();
  if(kør && kør.catch){
    kør.catch(() => {
      v.muted = true;                  // browseren siger nej til lyd — kør lydløst
      v.play().catch(videre);
    });
  }
  // Sikkerhedsnet: kommer den aldrig i gang, går vi videre af os selv
  let startet = false;
  v.addEventListener('playing', () => startet = true);
  setTimeout(() => { if(mit === sekvensId && !startet) videre(); }, 6000);
}

/* Areal af overlap mellem to cirkler → dækningsprocent */
function overlapProcent(d, rSol, rMaane){
  if(d >= rSol + rMaane) return 0;
  if(d <= Math.abs(rSol - rMaane)) return Math.min(rMaane, rSol)**2 / rSol**2 * 100;
  const a = rMaane*rMaane * Math.acos((d*d + rMaane*rMaane - rSol*rSol) / (2*d*rMaane));
  const b = rSol*rSol   * Math.acos((d*d + rSol*rSol   - rMaane*rMaane) / (2*d*rSol));
  const c = .5 * Math.sqrt((-d+rMaane+rSol)*(d+rMaane-rSol)*(d-rMaane+rSol)*(d+rMaane+rSol));
  return (a + b - c) / (Math.PI * rSol * rSol) * 100;
}

function saetTraek(){
  const svg   = document.getElementById('svg'),
        maane = document.getElementById('maane'),
        scene = document.getElementById('scene'),
        himmel= document.getElementById('himmel'),
        glow  = document.getElementById('glow'),
        hjaelp= document.getElementById('hjaelp');
  const rSol = 52, rMaane = 48.5, solX = 150, solY = 120;
  let traekker = false, laast = false;

  // SVG'ens egen omregning fra skærm til tegning — så det passer,
  // uanset hvor bred eller høj rammen bliver på den enkelte telefon.
  function tilSVG(e){
    const m = svg.getScreenCTM && svg.getScreenCTM();
    if(m && svg.createSVGPoint){
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(m.inverse());
      return { x:q.x, y:q.y };
    }
    const r = svg.getBoundingClientRect();          // nødløsning
    return { x:(e.clientX-r.left)/r.width*300, y:(e.clientY-r.top)/r.height*300 };
  }

  function flyt(x, y){
    x = Math.max(18, Math.min(282, x));
    y = Math.max(18, Math.min(230, y));
    // Lille "magnet" tæt på solen, så små fingre også kan ramme rent
    let d = Math.hypot(x - solX, y - solY);
    if(d > 0 && d < 30){
      const nyD = d * Math.pow(d/30, 1.3);
      x = solX + (x - solX)/d * nyD;
      y = solY + (y - solY)/d * nyD;
      d = nyD;
    }
    maane.setAttribute('cx', x); maane.setAttribute('cy', y);

    const pct = overlapProcent(d, rSol, rMaane);
    if(pct > maxNaaet) maxNaaet = pct;
    document.getElementById('mDaek').textContent = Math.round(pct) + ' %';
    const lys = Math.max(4, Math.round(100 - Math.pow(pct/100, 2.6) * 96));
    document.getElementById('mLys').textContent  = lys + ' %';
    document.getElementById('mTemp').textContent = Math.round(22 - pct/100*5) + '°';
    himmel.style.opacity = Math.pow(pct/100, 2.6) * .82;
    glow.setAttribute('r', 96 - pct*0.42);
    if(pct > 8 && hjaelp) hjaelp.style.opacity = 0;
    if(pct >= 78 && !laast){ laast = true; ramt(Math.round(maxNaaet)); }
  }

  // Man må tage fat hvor som helst i billedet — månen følger fingeren
  function ned(e){
    if(laast) return;
    traekker = true;
    if(scene.setPointerCapture && e.pointerId !== undefined){
      try{ scene.setPointerCapture(e.pointerId); }catch(err){}
    }
    const p = tilSVG(e); flyt(p.x, p.y);
    e.preventDefault();
  }
  function over(e){
    if(!traekker || laast) return;
    const p = tilSVG(e); flyt(p.x, p.y);
    e.preventDefault();
  }
  const op = () => { traekker = false; };

  if(window.PointerEvent){
    scene.addEventListener('pointerdown', ned);
    scene.addEventListener('pointermove', over);
    scene.addEventListener('pointerup', op);
    scene.addEventListener('pointercancel', op);
  }else{
    const touch = f => e => f(e.touches && e.touches[0] ? e.touches[0] : e);
    scene.addEventListener('touchstart', touch(ned), {passive:false});
    scene.addEventListener('touchmove',  touch(over), {passive:false});
    scene.addEventListener('touchend', op);
    scene.addEventListener('mousedown', ned);
    scene.addEventListener('mousemove', over);
    addEventListener('mouseup', op);
  }
}

/* ================================================================
   MINUT FOR MINUT — find selv det rigtige tidspunkt
   ================================================================ */
const URTID = { start:19*60+10, top:20*60+4, slut:20*60+54, dmin:8.11 };

function urFormat(t){
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}
function daekningVed(t){
  const rS = 52, rM = 48.5, dmax = rS + rM;
  let d;
  if(t <= URTID.start || t >= URTID.slut) d = dmax;
  else if(t < URTID.top) d = dmax + (URTID.dmin - dmax) * (t - URTID.start)/(URTID.top - URTID.start);
  else                   d = URTID.dmin + (dmax - URTID.dmin) * (t - URTID.top)/(URTID.slut - URTID.top);
  return overlapProcent(d, rS, rM);
}

function hvorfor(){
  trin = 7; opdaterTop();
  vis(`
    <div class="badge">Kapitel 3 · Minut for minut</div>
    <h2>Hvornår skal du kigge?</h2>
    <p>Formørkelsen varer næsten to timer. Men den er kun på sit højeste
    i få minutter — og dem vil du nødig gå glip af.</p>
    <p style="margin-top:10px"><b style="color:#ffd68a">Træk i uret og find det
    øjeblik, hvor mest af solen er dækket.</b></p>

    <div class="urkort">
      <div class="uroverst">
        <div class="urtid" id="urTid">19:10</div>
        <div class="urdaek"><span id="urPct">0</span> % dækket</div>
      </div>
      <svg id="urScene" viewBox="0 0 300 150"></svg>
      <input type="range" id="urSkyder" min="${19*60}" max="${21*60}" step="1" value="${19*60+10}">
      <div class="urskala"><span>19:00</span><span>20:00</span><span>21:00</span></div>
    </div>

    <div id="urSvar"></div>
  `);
  urSaetOp();
}

function urSaetOp(){
  const sk = document.getElementById('urSkyder'),
        scene = document.getElementById('urScene');
  let bedst = 0, laast = false;

  function tegn(t){
    const pct = daekningVed(t);
    document.getElementById('urTid').textContent = urFormat(t);
    document.getElementById('urPct').textContent = Math.round(pct);

    // Himlen bliver mørkere både af formørkelsen og af at solen går ned
    const aften = Math.min(1, Math.max(0, (t - 19*60)/150));
    const m = Math.pow(pct/100, 2.4);
    const top = [40 + aften*30 - m*30, 70 - aften*20 - m*45, 130 - aften*30 - m*70];
    const bund= [235 - aften*60 - m*90, 150 - aften*50 - m*60, 90 - aften*20 - m*40];
    const f = c => 'rgb(' + c.map(v => Math.max(8, Math.round(v))).join(',') + ')';

    // Solen står lavere og lavere
    const solY = 66 + aften*34;
    const rS = 21, rM = 19.6;
    const dmax = rS + rM, dmin = URTID.dmin/52*rS;
    let d;
    if(t <= URTID.start || t >= URTID.slut) d = dmax;
    else if(t < URTID.top) d = dmax + (dmin-dmax)*(t-URTID.start)/(URTID.top-URTID.start);
    else                   d = dmin + (dmax-dmin)*(t-URTID.top)/(URTID.slut-URTID.top);
    const retning = t < URTID.top ? -1 : 1;

    scene.innerHTML = `
      <defs>
        <linearGradient id="urhim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${f(top)}"/><stop offset="100%" stop-color="${f(bund)}"/>
        </linearGradient>
        <radialGradient id="urglo">
          <stop offset="40%" stop-color="#fff3c8" stop-opacity="${(.75*(1-m)).toFixed(2)}"/>
          <stop offset="100%" stop-color="#ffc46e" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="300" height="150" fill="url(#urhim)"/>
      <circle cx="150" cy="${solY}" r="${(46*(1-m*.55)).toFixed(1)}" fill="url(#urglo)"/>
      <circle cx="150" cy="${solY}" r="${rS}" fill="#ffe484"/>
      <circle cx="${150 + retning*d}" cy="${(solY - retning*d*0.34).toFixed(1)}" r="${rM}" fill="#0d1122"/>
      <path d="M0 122 Q40 112 78 121 Q120 131 165 119 Q215 108 300 118 L300 150 L0 150 Z"
            fill="#16241a" opacity=".95"/>
      <text x="150" y="144" fill="#9fb0c8" font-size="8.5" text-anchor="middle"
            font-family="inherit" opacity=".8">vest / nordvest</text>`;

    if(pct > bedst) bedst = pct;
    if(!laast && Math.abs(t - URTID.top) <= 3){ laast = true; urRamt(t); }
  }

  sk.addEventListener('input', () => tegn(+sk.value));
  tegn(+sk.value);
}

function urRamt(t){
  lydWow(); giv(3);
  document.getElementById('urSvar').innerHTML = `
    <div class="feedback">
      <b>⭐⭐⭐ Der er den — ${urFormat(t)}!</b><br>
      Klokken <b>20:04</b> er ${FAKTA.daekning} % af solen dækket, og så vender det.
      Læg mærke til to ting: det går <i>langsomt</i> — næsten en time hver vej —
      og solen står meget lavt. Derfor skal du finde et sted med frit udsyn mod
      vest og nordvest, ellers står formørkelsen bag et hus eller et træ.
    </div>
    <button class="knap" onclick="video4()">Videre til kapitel 4 →</button>`;
  const sv = document.getElementById('urSvar');
  if(sv && sv.scrollIntoView) sv.scrollIntoView({behavior:'smooth', block:'nearest'});
}

const DETEKTIV = [
  { sp:"Hvad gør fuglene, når det pludselig bliver mørkt om aftenen?",
    valg:["De bliver stille og flyver hjem i seng","De begynder at synge ekstra højt","De flyver i en stor cirkel"], r:0, spiller:1,
    voksen:{ valg:["De begynder at synge ekstra højt","De flyver højere op for at finde lyset","De bliver stille og søger mod reden","De reagerer ikke — 83 % er ikke nok","De flokkes og kredser"], r:2 },
    fb:"Fuglene tror, det er ved at blive nat, og bliver helt stille. Mange har fortalt, at det mest uhyggelige ved en solformørkelse er <b>stilheden</b>." },

  { sp:"Hvad sker der med temperaturen?",
    valg:["Den stiger","Der sker ikke noget","Den falder et par grader"], r:2, spiller:0,
    voksen:{ valg:["Den falder 10-15 grader","Den stiger let, fordi vinden lægger sig","Den ændrer sig ikke målbart","Den falder typisk 2-5 grader","Den falder først en time bagefter"], r:3 },
    fb:"Der forsvinder pludselig en masse varme fra solen, og det kan falde 2-5 grader. Tag en trøje med! <i>Det laveste punkt kommer typisk nogle minutter efter maksimum — jorden når ikke at følge med.</i>" },

  { sp:"Se ned under et træ, mens formørkelsen sker. Hvad kan {I} se på jorden?",
    valg:["Almindelige runde lyspletter","Hundredvis af små måneformede segl","Ingenting særligt"], r:1, spiller:'begge',
    voksen:{ valg:["Almindelige runde lyspletter, bare svagere","Hundredvis af små måneformede segl","Skarpe firkantede pletter","Bølgende mørke striber der løber hen over jorden","Ingenting — der er for lidt lys"], r:1 },
    fb:"Det fedeste trick af dem alle! Hullerne mellem bladene virker som bittesmå kameraer, og hver eneste lysplet på jorden får <b>samme form som den halvspiste sol</b>. Prøv det — {I} kan også lave det selv med et dørslag. <i>De bølgende striber findes, men ses kun lige omkring en total formørkelse.</i>" }
];

function detektiv(i){
  if(i >= DETEKTIV.length) return video5();
  const d = DETEKTIV[i];
  vis(`
    <div class="badge">Kapitel 4 · Detektivopgave ${i+1}/${DETEKTIV.length}</div>
    ${tur(d.spiller)}
    <div class="kort"><p style="font-size:19px;color:#f0f2f8">${tk(d.sp)}</p></div>
    <div class="valg" id="valg">
      ${svarSaet(d).valg.map((v,n)=>`<button onclick="svarDet(${i},${n})">${v}</button>`).join('')}
    </div>
    <div id="fb"></div>
  `);
}

function svarDet(i, valgt){
  const d = DETEKTIV[i], sæt = svarSaet(d), knapper = document.querySelectorAll('#valg button');
  knapper.forEach(b => { b.disabled = true; b.classList.add('blegn'); });
  knapper[sæt.r].classList.add('rigtigt'); knapper[sæt.r].classList.remove('blegn');
  const rigtigt = valgt === sæt.r;
  if(!rigtigt){ knapper[valgt].classList.add('forkert'); knapper[valgt].classList.remove('blegn'); }
  if(rigtigt){ giv(1); lydJa(); } else lydNej();
  document.getElementById('fb').innerHTML = `
    <div class="feedback"><b>${rigtigt ? '⭐ Flot!' : 'Ikke helt.'}</b><br>${tk(d.fb)}</div>
    <button class="knap" onclick="detektiv(${i+1})">Videre →</button>`;
}

const TING = [
  { em:"👁️", na:"Bare øjnene", ok:false, fb:"Nej! Selv med 83 % dækket kan solen brænde et blindt hul på nethinden — og det gør ikke ondt imens." },
  { em:"🕶️", na:"Almindelige solbriller", ok:false, fb:"Nej! Solbriller dæmper kun en lille del af lyset. De er alt for svage." },
  { em:"🥽", na:"Solformørkelses-briller (ISO 12312-2)", ok:true, fb:"JA! De er over 100.000 gange mørkere end solbriller. Det er de eneste briller, man må bruge." },
  { em:"🔭", na:"Kikkert eller teleskop", ok:false, fb:"Allerfarligst! En kikkert samler sollyset og gør det endnu stærkere. Aldrig uden et rigtigt solfilter foran." },
  { em:"🕳️", na:"Hulkamera af en papkasse", ok:true, fb:"JA! Man kigger den anden vej — solens billede vises på et stykke papir. 100 % sikkert og nemt at lave selv." },
  { em:"📱", na:"Mobilkameraet", ok:false, fb:"Nej — hverken for {jer} eller telefonen. Man kommer let til at kigge på solen mens man sigter, og kameraet kan tage skade." }
];
let sorteret = 0;

function sikkerhed(){
  trin = 10; opdaterTop(); sorteret = 0;
  vis(`
    <div class="badge">Kapitel 4 · Den vigtigste opgave</div>
    <h2>Hvad må man kigge igennem?</h2>
    <div class="advarsel">
      <b>⚠️ Den her del er alvor</b>
      <p>Solen er lige så farlig at kigge på under en formørkelse som alle andre dage.
      Forskellen er, at man får lyst til at kigge.</p>
    </div>
    ${tur('begge')}
    <p class="lille" style="margin-top:4px">Tryk på alle 6 og find ud af, hvad der er sikkert:</p>
    <div class="ting" id="ting">
      ${TING.map((t,i)=>`<button id="t${i}" onclick="trykTing(${i})">
        <span class="em">${t.em}</span><span class="na">${t.na}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
    <div id="naeste"></div>
  `);
}

function trykTing(i){
  const b = document.getElementById('t'+i);
  if(b.classList.contains('faerdig')) return;
  const t = TING[i];
  b.classList.add(t.ok ? 'ja' : 'nej', 'faerdig');
  t.ok ? lydJa() : lydNej();
  sorteret++; giv(1);
  document.getElementById('fb').innerHTML =
    `<div class="feedback"><b>${t.ok ? '✅ Sikkert' : '🚫 Farligt'} — ${t.na}</b><br>${tk(t.fb)}</div>`;
  if(sorteret === TING.length){
    giv(3);
    document.getElementById('naeste').innerHTML =
      `<button class="knap" onclick="diplom()">Afslut missionen 🏅</button>`;
  }
}

function tikTak(){
  const boks = document.getElementById('nedtaelling');
  if(!boks) return;

  const slutTid = new Date(2026, 7, 12, 20, 54, 0);   // formørkelsen er helt ovre
  const dagSlut = new Date(2026, 7, 13,  4,  0, 0);   // natten efter

  function opd(){
    if(!document.getElementById('nedtaelling')) return;   // brugeren er gået videre
    const nu = new Date(), ms = FAKTA.maalTid - nu;

    if(ms > 0){
      // Før formørkelsen — tæl ned
      const s = Math.floor(ms/1000);
      boks.innerHTML = `
        <p class="lille" style="letter-spacing:1px;margin-bottom:8px">DER ER NU</p>
        <div class="nedtael">
          <div><div class="t">${Math.floor(s/86400)}</div><div class="l">DAGE</div></div>
          <div><div class="t">${Math.floor(s%86400/3600)}</div><div class="l">TIMER</div></div>
          <div><div class="t">${Math.floor(s%3600/60)}</div><div class="l">MIN</div></div>
          <div><div class="t">${s%60}</div><div class="l">SEK</div></div>
        </div>
        <p class="lille">til formørkelsen topper ${FAKTA.dato} kl. ${FAKTA.maksimum}</p>`;

    }else if(nu < slutTid){
      // Midt i det hele
      boks.innerHTML = `
        <p style="font-size:22px;font-weight:800;color:#ffd68a;margin:6px 0">Det sker lige nu! 🌘</p>
        <p class="lille">Kig mod vest og nordvest — med solformørkelsesbriller på.</p>`;

    }else if(nu < dagSlut){
      // Samme aften, bagefter
      boks.innerHTML = `
        <p style="font-size:22px;font-weight:800;color:#ffd68a;margin:6px 0">Det skete i aften 🌘</p>
        <p class="lille">Håber ${O.du()} så det. Bliv ude lidt endnu —
        stjerneskuddene fra Perseiderne topper i nat.</p>`;

    }else{
      // Bagefter — tæl den anden vej
      const dage = Math.floor((nu - FAKTA.maalTid)/86400000);
      boks.innerHTML = `
        <p style="font-size:20px;font-weight:800;color:#ffd68a;margin:6px 0">Formørkelsen er overstået 🌘</p>
        <p class="lille">Det er <b style="color:#ffd68a">${dage}</b>
        ${dage === 1 ? 'dag' : 'dage'} siden den 12. august 2026.<br>
        Den næste lige så kraftige solformørkelse i Danmark er i <b style="color:#ffd68a">2048</b>.</p>`;
    }
    setTimeout(opd, 1000);
  }
  opd();
}
