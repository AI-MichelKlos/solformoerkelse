<body>

<canvas id="stjerner"></canvas>
<div class="wrap">
  <div class="top skjul" id="top">
    <div class="bar"><i id="barfyld"></i></div>
    <div class="stjernetal" id="stjernetal">⭐ 0</div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ==================================================================
   1) VIDEOER
   ------------------------------------------------------------------
   Læg dine fem videoer i mappen "videos/" med præcis disse filnavne,
   så finder spillet dem selv. Mangler en fil, viser spillet i stedet
   en kort beskrivelse — spillet virker fint uden videoerne.

   Vil du hellere bruge YouTube, så skriv et embed-link i stedet, fx:
   intro: "https://www.youtube.com/embed/XXXXXXXXXXX"
   ================================================================== */
const VIDEOER = {
  intro:    "videos/sol1.mp4",   // Månen glider ind foran solen
  historie: "videos/sol2.mp4",   // Ulven Sköll bider i solen
  maane:    "videos/sol3.mp4",   // Set fra rummet: månens skygge rammer Jorden
  moerke:   "videos/sol4.mp4",   // Fuglene bliver stille, lyset bliver gråt
  sikker:   "videos/sol5.mp4"    // Barn tager solformørkelsesbriller på
};

/* ==================================================================
   1b) TEGNESERIER
   ------------------------------------------------------------------
   Læg dine tegneserie-billeder i mappen "billeder/" med disse navne.
   Hvert felt er ÉT billede — enten en hel stribe i én fil, eller et
   billede du selv har sat sammen af 3-5 ruder.
   Mangler filen, viser spillet en tekstbeskrivelse i stedet.
   ================================================================== */
const BILLEDER = {
  lysrejse: "billeder/tegneserie1.jpg",   // Sollysets rejse til Jorden
  stoerrelse: "billeder/tegneserie2.jpg"  // Hvorfor sol og måne ser lige store ud
};

const BILLEDTEKST = {
  lysrejse:   "Tegneserie: sollysets 8 minutter lange rejse fra solen til Jorden.",
  stoerrelse: "Tegneserie: solen er kæmpestor og langt væk — månen er lille og tæt på."
};

/* Tekst der vises, hvis videofilen ikke findes */
const VIDEOTEKST = {
  intro:    "Solen på en blå himmel — månen glider langsomt ind foran og gør himlen mørkere.",
  historie: "Vikingemyten: en stor ulv bider i solen, mens folk nedenfor slår på skjolde.",
  maane:    "Set fra rummet: månen lægger sig mellem solen og Jorden og kaster en rund skygge.",
  moerke:   "Sen sommeraften: lyset bliver gråt og underligt, og fuglene holder op med at synge.",
  sikker:   "Et barn tager solformørkelsesbriller på og kigger trygt op mod himlen."
};

/* ==================================================================
   2) FAKTA — tallene gælder for København.
      I Vestjylland dækkes op til 88 % af solen.
   ================================================================== */
const FAKTA = {
  dato:     "12. august 2026",
  start:    "19:10",
  maksimum: "20:04",
  slut:     "20:54",
  daekning: 83,
  maalTid:  new Date(2026, 7, 12, 20, 4, 0)
};

/* ====================== Stjernehimmel ====================== */
(function(){
  const c = document.getElementById('stjerner'), x = c.getContext('2d');
  let s = [];
  function nyt(){
    c.width = innerWidth; c.height = innerHeight;
    s = Array.from({length:90}, () => ({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.4+.3, f:Math.random()*Math.PI*2, h:Math.random()*.02+.005
    }));
  }
  function tegn(){
    x.clearRect(0,0,c.width,c.height);
    for(const p of s){
      p.f += p.h;
      x.globalAlpha = .25 + Math.abs(Math.sin(p.f))*.6;
      x.fillStyle = '#fff';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    requestAnimationFrame(tegn);
  }
  nyt(); tegn(); addEventListener('resize', nyt);
})();

/* ====================== Lyd ====================== */
let lyd = null;
function bip(hz, laengde, type){
  try{
    lyd = lyd || new (window.AudioContext||window.webkitAudioContext)();
    const o = lyd.createOscillator(), g = lyd.createGain();
    o.type = type || 'sine'; o.frequency.value = hz;
    o.connect(g); g.connect(lyd.destination);
    g.gain.setValueAtTime(.09, lyd.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, lyd.currentTime + laengde);
    o.start(); o.stop(lyd.currentTime + laengde);
  }catch(e){}
}
const lydJa  = () => { bip(660,.12); setTimeout(()=>bip(990,.22),110); };
const lydNej = () => bip(180,.28,'square');
const lydWow = () => { [523,659,784,1047].forEach((h,i)=>setTimeout(()=>bip(h,.3),i*95)); };

/* ====================== Tilstand ====================== */
const app = document.getElementById('app');
let stjerner = 0, trin = 0;
const O = {
  solo: true,
  du(){ return 'du'; },
  duStor(){ return 'Du'; },
  dig(){ return 'dig'; },
  dinStor(){ return 'Din'; },
  erVoksne(){ return 'du er voksen'; },
  titel(){ return 'Certificeret Solformørkelses-ekspert'; }
};

function opdaterTop(){
  document.getElementById('top').classList.remove('skjul');
  document.getElementById('barfyld').style.width = (trin/ANTAL_TRIN*100) + '%';
  document.getElementById('stjernetal').textContent = '⭐ ' + stjerner;
}
function giv(n){ stjerner += n; opdaterTop(); }
function tk(s){ return s.replace(/\{I\}/g,O.du()).replace(/\{Is\}/g,O.duStor()).replace(/\{jer\}/g,O.dig()); }
function sikkerTekst(s){
  return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function videoHTML(noegle){
  const kilde = VIDEOER[noegle];
  const pladsholder = `<div class="ikon">🎬</div><div class="txt">${VIDEOTEKST[noegle]||''}</div>`;
  if(!kilde) return `<div class="videoslot">${pladsholder}</div>`;
  const erFil = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(kilde);
  const medie = erFil
    ? `<video src="${kilde}" controls playsinline preload="auto" onerror="this.remove()"></video>`
    : `<iframe src="${kilde}" allow="autoplay;accelerometer;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
  return `<div class="videoslot">${pladsholder}${medie}</div>`;
}

function billedHTML(noegle){
  const kilde = BILLEDER[noegle];
  const pladsholder =
    `<div class="ph"><div class="ikon">🖼️</div><div class="txt">${BILLEDTEKST[noegle]||''}</div></div>`;
  if(!kilde) return `<div class="billedslot fejl">${pladsholder}</div>`;
  return `<div class="billedslot">
    <img src="${kilde}" alt="${BILLEDTEKST[noegle]||''}"
         onerror="this.closest('.billedslot').classList.add('fejl'); this.remove();">
    ${pladsholder}
  </div>`;
}

function tegneserieSkaerm(noegle, overskrift, undertekst, naeste){
  vis(`
    <div class="badge">🖼️ Tegneserie</div>
    <h2>${overskrift}</h2>
    <p class="lille" style="margin-bottom:14px">${undertekst}</p>
    ${billedHTML(noegle)}
    <button class="knap" onclick="${naeste}">Videre →</button>
  `);
}

/* ================================================================

function videoSkaerm(noegle, overskrift, undertekst, naeste){
  vis(`

    <h2>${overskrift}</h2>
    <p class="lille" style="margin-bottom:14px">${undertekst}</p>

  `);
  startVideo();
}

function startVideo(){
  const v = document.querySelector('.videoslot video');
  const knap = document.getElementById('vidkn');
  if(!v){ if(knap) knap.classList.add('pulser'); return; }

  // Når videoen er slut, blinker Videre-knappen
  v.addEventListener('ended', () => { if(knap) knap.classList.add('pulser'); });

  // Prøv med lyd. Blokerer browseren det, kører den lydløst med en knap til at slå lyd til.
  const forsoeg = v.play();
  if(forsoeg && forsoeg.catch){
    forsoeg.catch(() => {
      v.muted = true;
      v.play().catch(() => { if(knap) knap.classList.add('pulser'); });
      const lk = document.getElementById('lydknap');
      if(lk) lk.innerHTML =
        `<button class="knap sekundaer" onclick="lydPaa(this)">🔊 Tænd lyden</button>`;
    });
  }
}

function lydPaa(b){
  const v = document.querySelector('.videoslot video');
  if(v){ v.muted = false; v.play().catch(()=>{}); }
  b.remove();
}

/* Areal af overlap mellem to cirkler → dækningsprocent */
function overlapProcent(d, rSol, rMaane){
  if(d >= rSol + rMaane) return 0;
  if(d <= Math.abs(rSol - rMaane)) return Math.min(rMaane, rSol)**2 / rSol**2 * 100;
  const a = rMaane*rMaane * Math.acos((d*d + rMaane*rMaane - rSol*rSol) / (2*d*rMaane));
  const b = rSol*rSol   * Math.acos((d*d + rSol*rSol   - rMaane*rMaane) / (2*d*rSol));
  const c = .5 * Math.sqrt((-d+rMaane+rSol)*(d+rMaane-rSol)*(d-rMaane+rSol)*(d+rMaane+rSol));
  return (a + b - c) / (Math.PI * rSol * rSol) * 100;
}

function saetTraek(){
  const svg   = document.getElementById('svg'),
        maane = document.getElementById('maane'),
        haand = document.getElementById('maanehaand'),
        scene = document.getElementById('scene'),
        himmel= document.getElementById('himmel'),
        glow  = document.getElementById('glow'),
        hjaelp= document.getElementById('hjaelp');
  const rSol = 52, rMaane = 48.5, solX = 150, solY = 120;
  let traekker = false, laast = false;

  function tilSVG(e){
    const r = svg.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX - r.left)/r.width*300, y:(p.clientY - r.top)/r.height*300 };
  }
  function flyt(x, y){
    x = Math.max(20, Math.min(280, x));
    y = Math.max(-70, Math.min(215, y));
    // Lille "magnet" tæt på solen, så små fingre også kan ramme rent
    let d = Math.hypot(x - solX, y - solY);
    if(d > 0 && d < 30){
      const nyD = d * Math.pow(d/30, 1.3);
      x = solX + (x - solX)/d * nyD;
      y = solY + (y - solY)/d * nyD;
      d = nyD;
    }
    maane.setAttribute('cx', x); maane.setAttribute('cy', y);
    haand.setAttribute('cx', x); haand.setAttribute('cy', y);

    const pct = overlapProcent(d, rSol, rMaane);
    if(pct > maxNaaet) maxNaaet = pct;
    document.getElementById('mDaek').textContent = Math.round(pct) + ' %';
    const lys = Math.max(4, Math.round(100 - Math.pow(pct/100, 2.6) * 96));
    document.getElementById('mLys').textContent  = lys + ' %';
    document.getElementById('mTemp').textContent = Math.round(22 - pct/100*5) + '°';
    himmel.style.opacity = Math.pow(pct/100, 2.6) * .82;
    glow.setAttribute('r', 96 - pct*0.42);
    if(pct > 8) hjaelp.style.opacity = 0;
    if(pct >= 78 && !laast){ laast = true; ramt(Math.round(maxNaaet)); }
  }

  const ned  = e => { if(!laast){ traekker = true; e.preventDefault(); } };
  const over = e => { if(traekker && !laast){ const p = tilSVG(e); flyt(p.x, p.y); e.preventDefault(); } };
  const op   = () => traekker = false;
  haand.addEventListener('touchstart', ned, {passive:false});
  haand.addEventListener('mousedown', ned);
  scene.addEventListener('touchmove', over, {passive:false});
  scene.addEventListener('mousemove', over);
  addEventListener('touchend', op); addEventListener('mouseup', op);
}

    document.getElementById('grader').textContent = v.toFixed(1).replace('.', ',') + '°';
    if(v < 0.6){
      t.textContent = 'I stregen — formørkelse! 🌘'; t.setAttribute('fill','#ffd166');
      l.setAttribute('opacity', .35);
    }else{
      t.textContent = 'Månen misser — ingenting sker'; t.setAttribute('fill','#8e97b5');
      l.setAttribute('opacity', .8);
    }
  });
}

/* ================================================================
   KAPITEL 3 — MISSION MØRKE
   ================================================================ */
function kapitel3(){
  trin = 8; opdaterTop();
  vis(`
    <div class="badge">Kapitel 4 af 4 · Mission Mørke</div>
    <h2>Detektivopgave</h2>
    <p>Den 12. august kl. ca. ${FAKTA.maksimum} sker der noget mærkeligt rundt omkring ${O.dig()} —
    ikke kun på himlen. Hvad tror ${O.du()} sker på jorden?</p>
    ${tur(1)}
    <button class="knap" onclick="detektiv(0)">Start efterforskningen 🔍</button>
  `);
}

const DETEKTIV = [
  { sp:"Hvad gør fuglene, når det pludselig bliver mørkt om aftenen?",
    valg:["De begynder at synge ekstra højt","De bliver stille og flyver hjem i seng","De flyver i en stor cirkel"],
    r:1, spiller:1,
    fb:"Rigtigt! Fuglene tror, det er ved at blive nat, og bliver helt stille. Mange har fortalt, at det mest uhyggelige ved en solformørkelse er <b>stilheden</b>." },
  { sp:"Hvad sker der med temperaturen?",
    valg:["Den falder et par grader","Den stiger","Der sker ikke noget"],
    r:0, spiller:0,
    fb:"Rigtigt — der forsvinder pludselig en masse varme fra solen, og det kan falde 2–5 grader. Tag en trøje med!" },
  { sp:"Se ned under et træ, mens formørkelsen sker. Hvad kan {I} se på jorden?",
    valg:["Almindelige runde lyspletter","Hundredvis af små måneformede segl","Ingenting særligt"],
    r:1, spiller:'begge',
    fb:"Det fedeste trick af dem alle! Hullerne mellem bladene virker som bittesmå kameraer, og hver eneste lysplet på jorden får <b>samme form som den halvspiste sol</b>. Prøv det — {I} kan også lave det selv med et dørslag." }
];

function detektiv(i){
  if(i >= DETEKTIV.length) return video5();
  const d = DETEKTIV[i];
  vis(`
    <div class="badge">Kapitel 4 · Detektivopgave ${i+1}/${DETEKTIV.length}</div>
    ${tur(d.spiller)}
    <div class="kort"><p style="font-size:19px;color:#f0f2f8">${tk(d.sp)}</p></div>
    <div class="valg" id="valg">
      ${d.valg.map((v,n)=>`<button onclick="svarDet(${i},${n})">${v}</button>`).join('')}
    </div>
    <div id="fb"></div>
  `);
}

function svarDet(i, valgt){
  const d = DETEKTIV[i], knapper = document.querySelectorAll('#valg button');
  knapper.forEach(b => { b.disabled = true; b.classList.add('blegn'); });
  knapper[d.r].classList.add('rigtigt'); knapper[d.r].classList.remove('blegn');
  const rigtigt = valgt === d.r;
  if(!rigtigt){ knapper[valgt].classList.add('forkert'); knapper[valgt].classList.remove('blegn'); }
  if(rigtigt){ giv(1); lydJa(); } else lydNej();
  document.getElementById('fb').innerHTML = `
    <div class="feedback"><b>${rigtigt ? '⭐ Flot!' : 'Ikke helt.'}</b><br>${tk(d.fb)}</div>
    <button class="knap" onclick="detektiv(${i+1})">Videre →</button>`;
}

const TING = [
  { em:"👁️", na:"Bare øjnene", ok:false, fb:"Nej! Selv med 83 % dækket kan solen brænde et blindt hul på nethinden — og det gør ikke ondt imens." },
  { em:"🕶️", na:"Almindelige solbriller", ok:false, fb:"Nej! Solbriller dæmper kun en lille del af lyset. De er alt for svage." },
  { em:"🥽", na:"Solformørkelses-briller (ISO 12312-2)", ok:true, fb:"JA! De er over 100.000 gange mørkere end solbriller. Det er de eneste briller, man må bruge." },
  { em:"🔭", na:"Kikkert eller teleskop", ok:false, fb:"Allerfarligst! En kikkert samler sollyset og gør det endnu stærkere. Aldrig uden et rigtigt solfilter foran." },
  { em:"🕳️", na:"Hulkamera af en papkasse", ok:true, fb:"JA! Man kigger den anden vej — solens billede vises på et stykke papir. 100 % sikkert og nemt at lave selv." },
  { em:"📱", na:"Mobilkameraet", ok:false, fb:"Nej — hverken for {jer} eller telefonen. Man kommer let til at kigge på solen mens man sigter, og kameraet kan tage skade." }
];
let sorteret = 0;

function sikkerhed(){
  trin = 10; opdaterTop(); sorteret = 0;
  vis(`
    <div class="badge">Kapitel 4 · Den vigtigste opgave</div>
    <h2>Hvad må man kigge igennem?</h2>
    <div class="advarsel">
      <b>⚠️ Den her del er alvor</b>
      <p>Solen er lige så farlig at kigge på under en formørkelse som alle andre dage.
      Forskellen er, at man får lyst til at kigge.</p>
    </div>
    ${tur('begge')}
    <p class="lille" style="margin-top:4px">Tryk på alle 6 og find ud af, hvad der er sikkert:</p>
    <div class="ting" id="ting">
      ${TING.map((t,i)=>`<button id="t${i}" onclick="trykTing(${i})">
        <span class="em">${t.em}</span><span class="na">${t.na}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
    <div id="naeste"></div>
  `);
}

function trykTing(i){
  const b = document.getElementById('t'+i);
  if(b.classList.contains('faerdig')) return;
  const t = TING[i];
  b.classList.add(t.ok ? 'ja' : 'nej', 'faerdig');
  t.ok ? lydJa() : lydNej();
  sorteret++; giv(1);
  document.getElementById('fb').innerHTML =
    `<div class="feedback"><b>${t.ok ? '✅ Sikkert' : '🚫 Farligt'} — ${t.na}</b><br>${tk(t.fb)}</div>`;
  if(sorteret === TING.length){
    giv(3);
    document.getElementById('naeste').innerHTML =
      `<button class="knap" onclick="diplom()">Afslut missionen 🏅</button>`;
  }
}

/* ================================================================
   DIPLOM + NEDTÆLLING
   ================================================================ */
function diplom(){
  trin = 12; opdaterTop(); lydWow();
  vis(`
    <div id="diplom">
      <div class="segl">🏅</div>
      <div class="badge">Officielt bevis</div>
      <p style="font-size:15px">Hermed udnævnes du til</p>
      <div class="navne">${O.titel()}</div>
      <hr>
      <p style="font-size:15px">Samlet: <b style="color:#ffd166;font-size:20px">⭐ ${stjerner} stjerner</b></p>
      <hr>
      <div id="nedtaelling"></div>
    </div>

    <div class="kort" style="margin-top:14px">
      <div class="badge">Huskeliste til den 12. august</div>
      <ul class="huske">
        <li>Solformørkelsesbriller — mærket <b>ISO 12312-2</b>. Køb dem i god tid.</li>
        <li>Vær klar kl. <b>${FAKTA.start}</b>. Den topper <b>${FAKTA.maksimum}</b> og slutter <b>${FAKTA.slut}</b>.</li>
        <li>Find et sted med <b>frit udsyn mod vest og nordvest</b> — solen står meget lavt.</li>
        <li>Lav et hulkamera af en papkasse dagen før.</li>
        <li>Tag en trøje med. Det bliver køligere.</li>
        <li>Kig ned under et træ og find de måneformede lyspletter.</li>
        <li>Bliv ude bagefter — samme aften topper stjerneskuddene fra Perseiderne.</li>
      </ul>
    </div>

    <button class="knap sekundaer" onclick="start()">Spil igen fra start</button>
    <p class="lille" style="text-align:center;margin-top:18px;line-height:1.6">
      Tidspunkter og 83 % gælder for København.<br>
      I Vestjylland dækkes op til 88 % af solen.</p>
    ${KREDIT}
  `);
  tikTak();
}

function tikTak(){
  const boks = document.getElementById('nedtaelling');
  if(!boks) return;

  const slutTid = new Date(2026, 7, 12, 20, 54, 0);   // formørkelsen er helt ovre
  const dagSlut = new Date(2026, 7, 13,  4,  0, 0);   // natten efter

  function opd(){
    if(!document.getElementById('nedtaelling')) return;   // brugeren er gået videre
    const nu = new Date(), ms = FAKTA.maalTid - nu;

    if(ms > 0){
      // Før formørkelsen — tæl ned
      const s = Math.floor(ms/1000);
      boks.innerHTML = `
        <p class="lille" style="letter-spacing:1px;margin-bottom:8px">DER ER NU</p>
        <div class="nedtael">
          <div><div class="t">${Math.floor(s/86400)}</div><div class="l">DAGE</div></div>
          <div><div class="t">${Math.floor(s%86400/3600)}</div><div class="l">TIMER</div></div>
          <div><div class="t">${Math.floor(s%3600/60)}</div><div class="l">MIN</div></div>
          <div><div class="t">${s%60}</div><div class="l">SEK</div></div>
        </div>
        <p class="lille">til formørkelsen topper ${FAKTA.dato} kl. ${FAKTA.maksimum}</p>`;

    }else if(nu < slutTid){
      // Midt i det hele
      boks.innerHTML = `
        <p style="font-size:22px;font-weight:800;color:#ffd68a;margin:6px 0">Det sker lige nu! 🌘</p>
        <p class="lille">Kig mod vest og nordvest — med solformørkelsesbriller på.</p>`;

    }else if(nu < dagSlut){
      // Samme aften, bagefter
      boks.innerHTML = `
        <p style="font-size:22px;font-weight:800;color:#ffd68a;margin:6px 0">Det skete i aften 🌘</p>
        <p class="lille">Håber ${O.du()} så det. Bliv ude lidt endnu —
        stjerneskuddene fra Perseiderne topper i nat.</p>`;

    }else{
      // Bagefter — tæl den anden vej
      const dage = Math.floor((nu - FAKTA.maalTid)/86400000);
      boks.innerHTML = `
        <p style="font-size:20px;font-weight:800;color:#ffd68a;margin:6px 0">Formørkelsen er overstået 🌘</p>
        <p class="lille">Det er <b style="color:#ffd68a">${dage}</b>
        ${dage === 1 ? 'dag' : 'dage'} siden den 12. august 2026.<br>
        Den næste lige så kraftige solformørkelse i Danmark er i <b style="color:#ffd68a">2048</b>.</p>`;
    }
    setTimeout(opd, 1000);
  }
  opd();
}

start();
</script>
