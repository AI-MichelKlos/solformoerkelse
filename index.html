<style>
  /* ============ SOLFORMØRKELSES-MISSIONEN v2.0 ============
     Samme skabelon som Forlig før daggry: mørk baggrund,
     papirkort, messing og stempler. Kun paletten er skiftet
     fra flaskegrøn mødebordsfilt til nattehimmel. */
  :root{
    --ink:#080c1c;   --ink-2:#0c1226;  --ink-3:#182240;      /* natten */
    --paper:#f6f1e2; --paper-2:#ece4cf;                       /* dokumenterne */
    --text:#26221a;  --muted:#9aa6c4;  --muted-paper:#7d745d;
    --green:#3d8a60; --green-dk:#2e6b4f;                      /* rigtigt svar */
    --red:#b03a2e;   --red-dk:#8c2d24;                        /* stempelrød */
    --gold:#d8b25c;  --gold-dk:#8f6f2a;                       /* messing og sol */
    --sun:#ffe484;   --sunglow:#ffd166;
    --line:rgba(216,178,92,.28); --line-paper:#d8d0ba;
    --shadow:0 28px 55px -20px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100svh;overflow-y:auto;-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(620px 560px at 50% 30px, rgba(255,233,184,.16) 0%, rgba(255,233,184,.05) 45%, transparent 70%),
      radial-gradient(130% 115% at 50% 42%, transparent 44%, rgba(0,0,0,.6) 100%),
      var(--ink);
    color:var(--paper);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 16px 24px;-webkit-font-smoothing:antialiased;
  }
  #stjerner{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  .stage{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}

  header.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 4px 8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:10px;line-height:1}
  .brand .logo{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(14px,4.4vw,20px);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .casecount{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:1px;white-space:nowrap}

  .record{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 4px}
  .segs{display:flex;gap:4px;flex:1}
  .seg{flex:1;height:16px;border-radius:2px;background:#0a1122;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:#fff;line-height:1;transition:background .4s,box-shadow .2s}
  .seg.r{background:var(--green)} .seg.w{background:var(--red)}
  .seg.cur{box-shadow:0 0 0 2px var(--gold)}
  .rec-lbl{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#b8c2d8;white-space:nowrap;letter-spacing:.5px}
  .rec-lbl b{color:var(--gold)}

  .panel{position:relative}
  .card,.screen,.avis{overflow-wrap:break-word;min-width:0}
  .card{background:linear-gradient(180deg,#f7f1de 0%,#efe6cc 58%,#e2d5b2 100%);color:var(--text);border-radius:4px;padding:56px 24px 24px;position:relative;overflow:hidden;border:1px solid var(--line-paper);
    transform:rotate(-.3deg);
    box-shadow:0 1px 0 rgba(0,0,0,.05), 0 12px 0 -6px var(--paper-2), 0 13px 0 -5px rgba(0,0,0,.22), var(--shadow)}
  .card > *{position:relative;z-index:1}
  .card > .stamp{position:absolute;z-index:3}
  .card::before{content:"OBSERVATORIET · KØBENHAVN";position:absolute;top:0;left:24px;right:24px;padding:13px 0 9px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:3.2px;color:var(--gold-dk);border-bottom:3px double rgba(143,111,42,.5);z-index:2}
  .stamp{position:absolute;top:16px;right:-4px;transform:rotate(-6deg);font-family:'Permanent Marker','Fraunces',serif;font-size:16px;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);padding:3px 12px;opacity:.85;background:transparent}
  .stamp::before{content:"";position:absolute;left:-3px;right:-5px;top:-2px;bottom:-1px;border:2.5px solid var(--red);border-radius:9px 4px 10px 5px;transform:rotate(1.4deg) skewX(-2deg);opacity:.85;pointer-events:none}
  .stamp.land{animation:stampIn .55s cubic-bezier(.18,1.25,.3,1) both}
  @keyframes stampIn{0%{opacity:0;transform:rotate(7deg) scale(2.7)}55%{opacity:.85;transform:rotate(7deg) scale(.9)}75%{transform:rotate(7deg) scale(1.05)}100%{opacity:.78;transform:rotate(7deg) scale(1)}}

  .portrait{position:absolute;top:18px;left:18px;width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #fbf7ea;box-shadow:0 4px 12px rgba(0,0,0,.3),0 0 0 1px rgba(143,111,42,.5);background:#2c2823;z-index:2}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05) sepia(.12) saturate(.9)}
  .card.has-portrait .meta,.card.has-portrait .country{padding-left:78px}

  .intro-h1{margin-top:2px}
  .intro-kl{font-family:'IBM Plex Mono',monospace;font-size:clamp(15px,4.4vw,20px);letter-spacing:3px;text-transform:uppercase;color:var(--muted-paper);margin:2px 0 14px}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted-paper);letter-spacing:1px;text-transform:uppercase;margin:6px 0 2px}
  .case-title{hyphens:none;-webkit-hyphens:none;overflow-wrap:break-word;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(21px,5.6vw,31px);line-height:1.18;text-transform:uppercase;letter-spacing:.5px;margin:2px 0 12px;color:#221c10}
  .situation{font-size:15.5px;line-height:1.55;color:#2c2823}
  .question{font-size:16px;line-height:1.45;color:#2c2823;font-weight:500;margin:0 0 14px}
  .answer{margin:4px 0 0;padding:12px 14px;background:rgba(46,107,79,.12);border-left:3px solid var(--green-dk);border-radius:4px;font-size:14.5px;line-height:1.5;color:#2a2620}
  .answer .alab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green-dk);display:block;margin-bottom:6px}
  .answer .asvar{display:block;font-weight:500}
  .answer .aforkl{display:block;margin-top:8px;padding-top:8px;border-top:1px solid rgba(46,107,79,.22);color:#4a443a}
  .prompt{font-family:'Fraunces',serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#6b6457;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
  .prompt::after{content:"";flex:1;height:1px;background:var(--line-paper)}

  .choices{display:flex;flex-direction:column;border-top:1px solid var(--line-paper);border-bottom:1px solid var(--line-paper)}
  .choice{text-align:left;width:100%;cursor:pointer;background:transparent;border:none;border-bottom:1px solid var(--line-paper);border-radius:0;padding:14px 12px;display:flex;gap:13px;align-items:flex-start;font-family:inherit;font-size:14.5px;line-height:1.45;color:#2a2620;transition:background .15s,box-shadow .15s}
  .choice:hover{background:rgba(143,111,42,.08);box-shadow:inset 3px 0 0 var(--gold-dk)}
  .choice:last-child{border-bottom:none}
  .choice:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
  .choice .key{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:19px;width:24px;flex:none;text-align:left;color:var(--gold-dk);text-transform:lowercase}
  .choice .key::after{content:'.'}

  .verdict{display:flex;align-items:center;gap:11px;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(23px,6.6vw,29px);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .verdict .dot{width:15px;height:15px;border-radius:50%;flex:none}
  .verdict.good{color:var(--green-dk)} .verdict.good .dot{background:var(--green)}
  .verdict.bad{color:var(--red-dk)} .verdict.bad .dot{background:var(--red)}
  .vsub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.5px;color:#6b6457;margin-bottom:14px}
  .truth{margin-top:16px;padding:13px 15px;background:rgba(176,58,46,.09);border-left:3px solid var(--red);border-radius:4px;font-size:13.5px;line-height:1.5;color:#4a443a}
  .truth .lab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--red-dk);display:block;margin-bottom:7px}
  .country{display:inline-block;font-family:'Fraunces',serif;font-weight:700;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--paper);background:var(--ink-3);padding:4px 11px;border-radius:4px;margin:2px 0 9px}
  .cardsub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted-paper);letter-spacing:.5px;margin:-4px 0 14px}
  .fotokredit{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#a0977f;margin:-9px 0 13px}
  .merebtn{margin-top:12px;background:none;border:none;padding:4px 0;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-dk);opacity:.8}
  .merebtn:hover{opacity:1}
  .merebtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
  .merebtn .pil{font-size:13px}
  .qbox{margin-top:8px;padding:12px 15px;background:rgba(216,178,92,.16);border-left:3px solid var(--gold);border-radius:4px}
  .qbox[hidden]{display:none}
  .qbox .qt{font-family:'Fraunces',serif;font-size:15px;line-height:1.55;color:#3f3a31}

  .cover-title{hyphens:none;-webkit-hyphens:none;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(30px,7.8vw,46px);line-height:1;text-transform:uppercase;letter-spacing:.5px;color:#221c10;margin:6px 0 2px}

  .fors{min-height:72svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 10px 30px}
  .fors .fpraes{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  .fors .ftitle{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(20px,6.8vw,50px);line-height:1.02;text-transform:uppercase;letter-spacing:.5px;color:#f4efe4;text-shadow:0 0 46px rgba(216,178,92,.28)}
  .fors .fsub{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(15px,4.4vw,21px);letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);margin-top:16px}
  .fors .fbtn{margin-top:28px}
  .hero{width:min(70vw,240px);margin:22px auto 6px}
  .hero svg{width:100%;height:auto;display:block}
  .hmaane{animation:glid 9s ease-in-out infinite alternate}
  @keyframes glid{from{transform:translate(-92px,-46px)}to{transform:translate(11px,7px)}}
  .glod{animation:aande 5s ease-in-out infinite alternate}
  @keyframes aande{from{opacity:.72}to{opacity:1}}
  .taeller{display:inline-flex;align-items:center;gap:12px;margin-top:20px;padding:11px 18px;border:1px solid var(--line);border-radius:6px;background:rgba(216,178,92,.08)}
  .taeller .dage{font-family:'Fraunces',serif;font-weight:700;font-size:32px;line-height:1;color:var(--gold)}
  .taeller .hvad{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:left;line-height:1.5}
  .fakta3{display:flex;justify-content:center;gap:26px;margin-top:24px}
  .fakta3 .t{font-family:'Fraunces',serif;font-weight:700;font-size:24px;color:var(--gold)}
  .fakta3 .u{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.6px;color:var(--muted);margin-top:2px}

  .dossier{border-top:1px solid var(--line-paper);border-bottom:1px solid var(--line-paper);padding:12px 0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
  .drow{display:flex;gap:12px;align-items:center;font-size:13.5px}
  .dk{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-paper);width:92px;flex:none}
  .dv{color:#2c2823}

  .btn{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:13px 24px;background:var(--ink-3);color:var(--paper);transition:transform .12s,box-shadow .15s,background .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(0,0,0,.6);background:#22305a}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .btn.go{background:linear-gradient(160deg,#eccd82,var(--gold) 55%,#b08f42);color:#241c0c;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.3)}
  .btn.go:hover{background:linear-gradient(160deg,#f3d894,#dcbb6d 55%,#bb9a4b)}
  .btn.big{font-size:18px;padding:16px 32px}
  .btn.fuld{width:100%;display:block;margin-top:10px}
  .btn small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10.5px;letter-spacing:.8px;text-transform:none;opacity:.75;margin-top:4px}
  .gate-btn{background:transparent;border:2px solid var(--gold);color:var(--gold);font-family:'Fraunces',serif;text-transform:uppercase;letter-spacing:3px;font-size:16px;padding:14px 32px;border-radius:6px;cursor:pointer;transition:background .2s}
  .gate-btn:hover{background:rgba(216,178,92,.14)}
  .backlink{background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:#a89e86;cursor:pointer;padding:6px 2px;opacity:.65;transition:opacity .15s,color .15s}
  .backlink:hover{opacity:1;color:#6b6457}
  .backrow{margin-top:12px;display:flex}
  .actions{margin-top:18px;display:flex;justify-content:flex-end;align-items:center;gap:12px}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

  .screen{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:30px 24px;box-shadow:var(--shadow)}

  /* ---------- Plancher: tegnede figurer paa papir ---------- */
  .planchefig{background:#0c1226;border:1px solid var(--line-paper);border-radius:3px;padding:8px;margin:12px 0 14px}
  .planchefig svg{width:100%;height:auto;display:block;font-family:'Inter',sans-serif}

  /* ---------- Feltoevelse 1: skab formoerkelsen ---------- */
  .maalere{display:flex;gap:8px;margin:6px 0 12px}
  .maaler{flex:1;text-align:center;border:1px solid var(--line-paper);border-radius:4px;padding:8px 4px;background:rgba(24,34,64,.06)}
  .maaler .v{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:#221c10;line-height:1}
  .maaler .n{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.4px;color:var(--muted-paper);margin-top:4px}
  #scene{position:relative;border-radius:4px;overflow:hidden;background:#7ea8c8;border:1px solid var(--line-paper);touch-action:none;cursor:grab}
  #scene svg{width:100%;height:auto;display:block}
  #hjaelp{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:#ffe9b8;transition:opacity .4s;text-shadow:0 2px 8px #000}
  .felt-fb{margin-top:14px;padding:13px 15px;background:rgba(216,178,92,.16);border-left:3px solid var(--gold);border-radius:4px;font-size:14px;line-height:1.55;color:#3f3a31}
  .felt-fb b{color:#221c10}

  /* ---------- Feltoevelse 2: minut for minut ---------- */
  .urkort{border:1px solid var(--line-paper);border-radius:4px;overflow:hidden;background:#0a1024;margin:12px 0 4px}
  .uroverst{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:rgba(216,178,92,.1)}
  .urtid{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--gold);line-height:1}
  .urdaek{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:#c8d0e4}
  #urScene{width:100%;height:auto;display:block}
  #urSkyder{width:calc(100% - 24px);margin:12px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#2a3556,var(--gold))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--sun);border:2px solid #fff8d8;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#2a3556}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--sun);border:2px solid #fff8d8}
  .urskala{display:flex;justify-content:space-between;padding:0 14px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:#8f9ab8}

  /* ---------- Feltoevelse 3: sikkerhedstjek ---------- */
  .advarsel{margin:12px 0 14px;padding:13px 15px;background:rgba(176,58,46,.1);border-left:3px solid var(--red);border-radius:4px}
  .advarsel b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red-dk);margin-bottom:6px}
  .advarsel p{font-size:14px;line-height:1.5;color:#4a443a}
  .ting{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .ting button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line-paper);border-radius:5px;background:#fbf7ea;cursor:pointer;font-family:inherit;transition:transform .12s,background .2s,border-color .2s}
  .ting button:hover{transform:translateY(-2px)}
  .ting button .em{font-size:28px;line-height:1}
  .ting button .na{font-size:12.5px;line-height:1.35;text-align:center;color:#2a2620}
  .ting button.ja{background:rgba(61,138,96,.18);border-color:var(--green-dk)}
  .ting button.nej{background:rgba(176,58,46,.14);border-color:var(--red)}
  .ting button.faerdig{cursor:default}

  /* ---------- Avisforsiden til sidst ---------- */
  .avis{background:#f7f4ec;color:#16130d;border-radius:2px;padding:22px 20px 18px;border:1px solid #c9c0ad;box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 0 -7px #efe9da,0 15px 0 -6px rgba(0,0,0,.18),var(--shadow);margin-bottom:16px}
  .avis .ahoved{overflow-wrap:break-word;font-family:'Fraunces',serif;font-weight:700;font-size:clamp(34px,11vw,58px);letter-spacing:2px;text-align:center;text-transform:uppercase;line-height:.9;margin-bottom:2px}
  .avis .aslogan{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(12.5px,3.6vw,15px);text-align:center;color:#3a352b;padding-bottom:9px;border-bottom:3px solid #16130d}
  .avis .adato{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:#16130d;border-bottom:1px solid #c9c0ad;padding:6px 2px}
  .avis .aover{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8a2b1d;text-align:center;margin:15px 0 6px}

(function(){

  let s = [];
  function nyt(){
    c.width = innerWidth; c.height = innerHeight;
    const n = Math.round(innerWidth*innerHeight/9000);
    s = [];
    for(let i=0;i<n;i++) s.push({ x:Math.random()*c.width, y:Math.random()*c.height, r:Math.random()*1.3+.2, f:Math.random()*.5+.25, t:Math.random()*6.28 });
  }
  function tegn(){
    x.clearRect(0,0,c.width,c.height);
    for(const p of s){
      p.t += .012;
      x.globalAlpha = p.f + Math.sin(p.t)*.22;
      x.fillStyle = "#dfe6f5";
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.29); x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(tegn);
  }
  try{ nyt(); tegn(); addEventListener('resize', nyt); }catch(e){}
})();

let lydCtx = null;
let lydDoed = false;
function bip(hz, laengde, type){
  if(lydDoed) return;
  try{
    if(!lydCtx) lydCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = lydCtx.createOscillator(), g = lydCtx.createGain();
    o.type = type || "sine"; o.frequency.value = hz;
    g.gain.setValueAtTime(.14, lydCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, lydCtx.currentTime + laengde);
    o.connect(g); g.connect(lydCtx.destination);
    o.start(); o.stop(lydCtx.currentTime + laengde);
  }catch(e){ lydDoed = true; }
}
function lydJa(){ bip(660,.12); setTimeout(function(){ bip(880,.16); },110); }
function lydNej(){ bip(200,.22,"triangle"); }

/* ====================== 8) FILMLAGET ======================
   Samme motor som i Forlig før daggry: et fuldskaermsoverlay,
   videoerne primes stumt i selve trykket, saa Safari giver lyd. */
function filmSekvens(klipListe, next0){
  let kaldt = false;
  const next = function(){ if(kaldt) return; kaldt = true; next0(); };
  const klip = klipListe.filter(function(k){ return !!k; });
  if(!klip.length){ next(); return; }

  const ov = document.createElement('div');
  ov.className = 'film-overlay';
  ov.innerHTML = '<div class="ss-frame" id="fs-frame"></div>';
  document.body.appendChild(ov);
  const skip = document.createElement('button');
  skip.className = 'film-skip'; skip.textContent = 'Videre \u25b8';
  skip.style.display = 'none';
  /* Knappen kom foer efter 40 sek., men ingen sekvens varer saa laenge,
     saa den naaede aldrig frem. 1,8 sek. giver klippet lov at begynde,
     uden at nogen sidder fast i det. */
  const nedfald = setTimeout(function(){ skip.style.display = ''; }, 1800);
  document.body.appendChild(skip);
  const frame = ov.querySelector('#fs-frame');

  const el = klip.map(function(src){
    const v = document.createElement('video');
    v.className = 'ss-video';
    v.src = src;
    v.playsInline = true; v.setAttribute('playsinline','');
    v.preload = 'auto';
    v._overtaget = false;
    try{
      v.muted = true; v.setAttribute('muted','');
      const p = v.play();
      if(p) p.then(function(){ if(v._overtaget) return; v.pause(); v.currentTime = 0; }).catch(function(){});
    }catch(e){}
    return v;
  });

  let done = false;
  function finish(){
    if(done) return; done = true;
    frame.querySelectorAll('video').forEach(function(v){ try{ v.pause(); }catch(e){} });
    clearTimeout(nedfald);
    try{ next(); }catch(e){}
    ov.classList.add('out');
    setTimeout(function(){ ov.remove(); skip.remove(); }, 460);
  }
  skip.onclick = finish;

  function playClip(i){
    if(done) return;
    if(i >= el.length){ finish(); return; }
    const v = el[i];
    if(v.error){ playClip(i+1); return; }
    v._overtaget = true;
    v.removeAttribute('muted'); v.muted = false;
    try{ v.currentTime = 0; }catch(e){}
    let gaaet = false;
    const videre = function(){ if(gaaet) return; gaaet = true; v.remove(); playClip(i+1); };
    v.onended = videre;
    v.onerror = videre;
    v.onclick = function(){ if(v.paused){ v.play().catch(function(){}); } else { v.pause(); } };
    frame.appendChild(v);
    v.play().catch(function(){});
    setTimeout(function(){ if(!done && !gaaet && v.paused && v.currentTime === 0) videre(); }, 11000);
  }
  playClip(0);
}

/* Billedsekvens med musik, Ken Burns og pause paa klik */
function billedSekvens(slides, musikfil, next0){
  let kaldt = false;
  const next = function(){ if(kaldt) return; kaldt = true; next0(); };
  const ov = document.createElement('div');
  ov.className = 'film-overlay';
  ov.innerHTML = '<div class="ss-frame" id="bs-frame"></div>'
    + '<div class="ss-pauselbl">Pause</div>'
    + '<div class="ss-bar"><div class="ss-fill" id="bs-fill"></div></div>';
  document.body.appendChild(ov);
  const skip = document.createElement('button');
  skip.className = 'film-skip'; skip.textContent = 'Videre \u25b8';
  skip.style.display = 'none';
  /* Knappen kom foer efter 40 sek., men ingen sekvens varer saa laenge,
     saa den naaede aldrig frem. 1,8 sek. giver klippet lov at begynde,
     uden at nogen sidder fast i det. */
  const nedfald = setTimeout(function(){ skip.style.display = ''; }, 1800);
  document.body.appendChild(skip);

  const frame = ov.querySelector('#bs-frame');
  const fill = ov.querySelector('#bs-fill');
  slides.forEach(function(s){ if(s.src){ const im = new Image(); im.src = s.src; if(im.decode) im.decode().catch(function(){}); } });

  const TOTAL = slides.reduce(function(a,s){ return a + s.dur; }, 0);
  const starts = []; let acc = 0;
  slides.forEach(function(s){ starts.push(acc); acc += s.dur; });

  const audio = musikfil ? new Audio(musikfil) : null;
  if(audio) audio.preload = 'auto';

  let prev = null, cur = -1, pausedAcc = 0, pausedAt = 0, paused = false, done = false, raf = null;
  const t0 = performance.now();

  function build(s){
    const el = document.createElement('div');
    if(s.src && s.rude !== undefined){
      /* Beskaeret felt af en tegneseriestribe paa 2 gange 2 felter */
      const kol = s.rude % 2, raek = Math.floor(s.rude / 2);
      el.className = 'ss-slide ss-imgslide';
      el.innerHTML = '<div class="ss-imgwrap"><div class="ss-rude ss-kb" style="--kb:'+(s.dur/1000)+'s;'
        + 'background-image:url(\''+s.src+'\');background-size:200% 200%;'
        + 'background-position:'+(kol*100)+'% '+(raek*100)+'%"></div></div>'
        + (s.cap ? '<div class="ss-cap">'+s.cap+'</div>' : '');
    } else if(s.src){
      el.className = 'ss-slide ss-imgslide';
      el.innerHTML = '<div class="ss-imgwrap"><img class="ss-kb" style="--kb:'+(s.dur/1000)+'s" src="'+s.src+'" alt="" onerror="this.style.display=\'none\'"></div>'
        + (s.cap ? '<div class="ss-cap">'+s.cap+'</div>' : '');
    } else {
      el.className = 'ss-slide';
      let m = "";
      if(s.kicker) m += '<div class="ss-kicker">'+s.kicker+'</div>';
      if(s.title)  m += '<div class="ss-title">'+s.title+'</div>';
      if(s.sub)    m += '<div class="ss-sub">'+s.sub+'</div>';
      if(s.body)   m += '<div class="ss-body">'+s.body+'</div>';
      m += '<div class="ss-rule"></div>';
      el.innerHTML = m;
    }
    return el;
  }
  function show(i){
    const el = build(slides[i]);
    frame.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('vis'); }); });
    if(prev){ const p = prev; p.classList.remove('vis'); setTimeout(function(){ if(p.parentNode) p.remove(); }, 720); }
    prev = el;
  }
  function finish(){
    if(done) return; done = true;
    if(raf) cancelAnimationFrame(raf);
    if(audio){ try{ audio.pause(); }catch(e){} }
    document.removeEventListener('visibilitychange', visHandler);
    clearTimeout(nedfald);
    try{ next(); }catch(e){}
    ov.classList.add('out');
    setTimeout(function(){ ov.remove(); skip.remove(); }, 460);
  }
  function tick(){
    if(done || paused) return;
    const e = performance.now() - t0 - pausedAcc;
    fill.style.transform = 'scaleX(' + Math.min(e/TOTAL, 1) + ')';
    let idx = 0;
    for(let i=0;i<starts.length;i++){ if(e >= starts[i]) idx = i; }
    if(idx !== cur){ cur = idx; show(idx); }
    if(e >= TOTAL){ setTimeout(finish, 600); return; }
    raf = requestAnimationFrame(tick);
  }
  function doPause(){
    if(done || paused) return;
    paused = true; pausedAt = performance.now();
    if(raf) cancelAnimationFrame(raf);
    if(audio){ try{ audio.pause(); }catch(e){} }
    ov.classList.add('ss-paused');
  }
  function doResume(){
    if(done || !paused) return;
    paused = false; pausedAcc += performance.now() - pausedAt;
    ov.classList.remove('ss-paused');
    if(audio){ try{ audio.play().catch(function(){}); }catch(e){} }
    raf = requestAnimationFrame(tick);
  }
  skip.onclick = finish;
  ov.addEventListener('click', function(){ paused ? doResume() : doPause(); });
  const visHandler = function(){ if(document.hidden) doPause(); };
  document.addEventListener('visibilitychange', visHandler);
  if(audio){ try{ audio.play().catch(function(){}); }catch(e){} }
  raf = requestAnimationFrame(tick);
}

/* ====================== 10) FELTØVELSE 1: SKAB FORMØRKELSEN ====================== */
function overlapProcent(d, rSol, rMaane){
  if(d >= rSol + rMaane) return 0;
  if(d <= Math.abs(rSol - rMaane)) return Math.pow(Math.min(rMaane,rSol),2) / Math.pow(rSol,2) * 100;
  const a = rMaane*rMaane * Math.acos((d*d + rMaane*rMaane - rSol*rSol) / (2*d*rMaane));
  const b = rSol*rSol   * Math.acos((d*d + rSol*rSol   - rMaane*rMaane) / (2*d*rSol));
  const c = .5 * Math.sqrt((-d+rMaane+rSol)*(d+rMaane-rSol)*(d-rMaane+rSol)*(d+rMaane+rSol));
  return (a + b - c) / (Math.PI * rSol * rSol) * 100;
}

    + '<div id="mFb"></div><div id="mNaeste"></div>'

  window.scrollTo(0,0);
  const afbrydUdgang = noedudgang('mNaeste', next);

  const svg = document.getElementById('msvg'),

        himmel = document.getElementById('himmel'),
        glow = document.getElementById('glow'),
        hjaelp = document.getElementById('hjaelp');
  const rSol = 52, rMaane = 48.5, solX = 150, solY = 120;
  let traekker = false, laast = false;

  function tilSVG(e){
    const m = svg.getScreenCTM && svg.getScreenCTM();
    if(m && svg.createSVGPoint){
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(m.inverse());
      return { x:q.x, y:q.y };
    }
    const r = svg.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*300, y:(e.clientY-r.top)/r.height*300 };
  }
  function flyt(x, y){
    x = Math.max(18, Math.min(282, x));
    y = Math.max(18, Math.min(230, y));
    let d = Math.hypot(x - solX, y - solY);
    if(d > 0 && d < 30){
      const nyD = d * Math.pow(d/30, 1.3);
      x = solX + (x - solX)/d * nyD;
      y = solY + (y - solY)/d * nyD;
      d = nyD;

    maane.setAttribute('cx', x); maane.setAttribute('cy', y);
    const pct = overlapProcent(d, rSol, rMaane);

    if(pct >= 78 && !laast){ laast = true; ramt(Math.round(maxNaaet)); }
  }

    if(laast) return;
    traekker = true;
    if(scene.setPointerCapture && e.pointerId !== undefined){ try{ scene.setPointerCapture(e.pointerId); }catch(err){} }
    const p = tilSVG(e); flyt(p.x, p.y); e.preventDefault();
  }
  function over(e){
    if(!traekker || laast) return;
    const p = tilSVG(e); flyt(p.x, p.y); e.preventDefault();
  }
  const op = function(){ traekker = false; };
  if(window.PointerEvent){
    scene.addEventListener('pointerdown', ned);
    scene.addEventListener('pointermove', over);
    scene.addEventListener('pointerup', op);
    scene.addEventListener('pointercancel', op);
  } else {
    const touch = function(f){ return function(e){ f(e.touches && e.touches[0] ? e.touches[0] : e); }; };
    scene.addEventListener('touchstart', touch(ned), {passive:false});
    scene.addEventListener('touchmove', touch(over), {passive:false});

/* ====================== 11) FELTØVELSE 2: MINUT FOR MINUT ====================== */
const URTID = { start:19*60+10, top:20*60+3, slut:20*60+54, dmin:8.11 };
function urFormat(t){ return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }
function daekningVed(t){
  const rS = 52, rM = 48.5, dmax = rS + rM;
  let d;
  if(t <= URTID.start || t >= URTID.slut) d = dmax;
  else if(t < URTID.top) d = dmax + (URTID.dmin - dmax) * (t - URTID.start)/(URTID.top - URTID.start);
  else                   d = URTID.dmin + (dmax - URTID.dmin) * (t - URTID.top)/(URTID.slut - URTID.top);
  return overlapProcent(d, rS, rM);
}

function titelsekvens(){
  const musik = new Audio(MUSIK.titel);
  musik.play().catch(function(){});

  const ov = document.createElement('div');
  ov.className = 'film-overlay';
  ov.innerHTML = '<div class="ss-frame" id="tit-frame"></div>';
  document.body.appendChild(ov);
  const skip = document.createElement('button');
  skip.className = 'film-skip'; skip.textContent = 'Videre \u25b8';
  skip.style.display = 'none';
  /* Knappen kom foer efter 40 sek., men ingen sekvens varer saa laenge,
     saa den naaede aldrig frem. 1,8 sek. giver klippet lov at begynde,
     uden at nogen sidder fast i det. */
  const nedfald = setTimeout(function(){ skip.style.display = ''; }, 1800);
  document.body.appendChild(skip);
  const frame = ov.querySelector('#tit-frame');

  /* Tider afstemt efter introsol.mp3 (15,31 sek.). Der ligger 500 ms
     krydsfade mellem kortene, saa 4700 + 500 + 4700 + 500 + 4900 = 15,30 sek. */
  const KORT = [
    {dur:4700, html:'<div class="ss-title" style="font-size:clamp(26px,7.4vw,44px);hyphens:none;-webkit-hyphens:none">KlosKlos og Reagan Production</div><div class="ss-sub">præsenterer</div>'},
    {dur:4700, html:'<div class="ss-sub">i samarbejde med</div><div class="ss-title" style="font-size:clamp(23px,7.4vw,44px);hyphens:none;-webkit-hyphens:none">Observatoriet på Egernvej</div>'},
    {dur:4900, html:'<div class="ss-title" style="font-size:clamp(19px,6.3vw,40px)">Solformørkelses-<br>Missionen</div><div class="ss-rule"></div>'}
  ];

  let done = false, prev = null;
  function finish(){
    if(done) return; done = true;
    try{ musik.pause(); }catch(e){}
    clearTimeout(nedfald);
    try{ intro(); }catch(e){}
    ov.classList.add('out');
    setTimeout(function(){ ov.remove(); skip.remove(); }, 460);
  }
  skip.onclick = finish;

  function vis(i){
    if(done) return;
    if(i >= KORT.length){ finish(); return; }
    const tegn = function(){
      if(done) return;
      const el = document.createElement('div');
      el.className = 'ss-slide';
      el.innerHTML = KORT[i].html;
      frame.appendChild(el);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('vis'); }); });
      prev = el;
      setTimeout(function(){ vis(i+1); }, KORT[i].dur);
    };
    if(prev){
      const p = prev; prev = null;
      p.classList.remove('vis');
      setTimeout(function(){ if(p.parentNode) p.remove(); tegn(); }, 500);
    } else tegn();
  }
  vis(0);
}

function showPunkt(){
  const p = PUNKTER[state.i];
  const b = parseBased(p.based);
  const nr = String(state.i+1).padStart(2,'0');
  const saet = svarSaet(p);
  const ord = shuffle(saet.map(function(_,i){ return i; }));
  state.slots = ord;

  caseCount.textContent = 'PUNKT ' + (state.i+1) + ' / ' + RUNDE + ' \u00b7 kl. ' + TIDER[state.i];
  renderRecord();

  const buttons = ord.map(function(optIdx, slot){
    return '<button class="choice" data-slot="'+slot+'"><span class="key">'+BOGSTAV[slot]+'</span><span>'+saet[optIdx].t+'</span></button>';
  }).join('');
  const portraet = portraetHTML(p.id);

  app.innerHTML = '<div class="panel fade"><div class="card'+(portraet?' has-portrait':'')+'">'
    + portraet
    + '<div class="meta">Punkt '+nr+' \u00b7 aftenens missionsplan</div>'
    + '<div class="country">'+p.kat+'</div>'
    + '<h2 class="case-title">'+p.titel+'</h2>'
    + '<div class="cardsub">'+p.based+'</div>'
    + fotokreditHTML(p.id)
    + '<p class="situation">'+p.situation+'</p>'
    + '<div class="prompt">Spørgsmål</div>'
    + '<p class="question">'+p.spm+'</p>'
    + '<div class="choices">'+buttons+'</div>'
    + (state.i > 0 ? '<div class="backrow"><button class="backlink" id="backbtn">\u2039 Forrige punkt</button></div>' : '')
    + '</div></div>';
  window.scrollTo(0,0);

  app.querySelectorAll('.choice').forEach(function(btn){
    btn.onclick = function(){ vaelg(parseInt(btn.dataset.slot,10)); };
  });
  window.onkeydown = function(e){
    const k = (e.key || '').toLowerCase();
    let idx = BOGSTAV.indexOf(k);
    if(idx < 0 && /^[1-5]$/.test(k)) idx = parseInt(k,10) - 1;
    if(idx >= 0){ const btns = app.querySelectorAll('.choice'); if(btns[idx]) btns[idx].click(); }
  };
  const bb = document.getElementById('backbtn');
  if(bb) bb.onclick = function(){
    state.i--;
    state.history[state.i] = undefined;
    tally(); renderRecord(); showPunkt();
  };
}

function vaelg(slot){
  const p = PUNKTER[state.i];
  const b = parseBased(p.based);
  const nr = String(state.i+1).padStart(2,'0');
  const saet = svarSaet(p);
  const picked = saet[ state.slots[slot] ];
  const good = !!picked.ok;
  const correct = saet.find(function(o){ return o.ok; });

  state.history[state.i] = good;
  tally();
  renderRecord();
  good ? lydJa() : lydNej();

  const portraet = portraetHTML(p.id);

  app.innerHTML = '<div class="panel fade"><div class="card'+(portraet?' has-portrait':'')+'">'
    + '<div class="stamp land" style="'+(good?'color:var(--green)':'')+'">'+(good ? 'Bekræftet' : 'Rettet')+'</div>'
    + portraet
    + '<div class="meta">Punkt '+nr+' \u00b7 dit svar</div>'
    + '<div class="country">'+p.kat+'</div>'
    + '<h2 class="case-title">'+p.titel+'</h2>'
    + fotokreditHTML(p.id)
    + '<div class="verdict '+(good?'good':'bad')+'"><span class="dot"></span>'+(good ? 'Rigtigt' : 'Ikke helt')+'</div>'
    + (good ? '' : '<div class="vsub">Du svarede: '+picked.t+'</div>')
    + (good
        ? '<div class="truth"><span class="lab">Derfor</span>'+p.forklaring+'</div>'
        : '<div class="answer"><span class="alab">Det rigtige svar</span>'
          + '<span class="asvar">'+correct.t+'</span>'
          + '<span class="aforkl">'+p.forklaring+'</span></div>')
    + '<button class="merebtn" id="merebtn" aria-expanded="false">Mere <span class="pil">\u25be</span></button>'
    + '<div class="qbox" id="merebox" hidden><div class="qt">'+p.mere+'</div></div>'
    + '<div class="actions" id="act"></div>'
    + '</div></div>';
  window.scrollTo(0,0);

  const mb = document.getElementById('merebtn'), mbox = document.getElementById('merebox');
  mb.onclick = function(){
    const aaben = !mbox.hasAttribute('hidden');
    if(aaben){ mbox.setAttribute('hidden',''); } else { mbox.removeAttribute('hidden'); }
    mb.setAttribute('aria-expanded', aaben ? 'false' : 'true');
    mb.innerHTML = (aaben ? 'Mere ' : 'Mindre ') + '<span class="pil">' + (aaben ? '\u25be' : '\u25b4') + '</span>';
  };

  const act = document.getElementById('act');
  act.style.justifyContent = 'space-between';
  window.onkeydown = function(e){ if(e.key === 'Enter'){ const n = document.getElementById('next'); if(n) n.click(); } };
  const tilbage = '<button class="backlink" id="svarom">\u2039 Svar om</button>';

  if(state.i === RUNDE - 1){
    /* Efter sidste punkt koeres de to sidste feltoevelser og sikkerhedstjekket. */
    act.innerHTML = tilbage + '<button class="btn go big" id="next">Sidste opgaver \u25b8</button>';
    enGang(document.getElementById('next'), function(){
      urmission(function(){
        planche('hulkamera', function(){
          filmSekvens([VIDEO.briller], function(){ sikkerhedstjek(ending); });
        });
      });
    });
  } else {
    const mellemspil = MELLEMSPIL[String(state.i+2).padStart(2,'0')];
    if(mellemspil && !state.gjort[state.i+1]){
      act.innerHTML = tilbage + '<button class="btn go big" id="next">'+mellemspil.knap+' \u25b8</button>';
      enGang(document.getElementById('next'), function(){
        state.gjort[state.i+1] = true;
        mellemspil.kald(function(){ state.i++; showPunkt(); });
      });
    } else {
      act.innerHTML = tilbage + '<button class="btn big" id="next">Næste punkt \u25b8</button>';
      enGang(document.getElementById('next'), function(){ state.i++; showPunkt(); });
    }
  }
  const so = document.getElementById('svarom');
  if(so) so.onclick = function(){
    state.history[state.i] = undefined;
    tally(); renderRecord(); showPunkt();
  };
}

/* Lysstraalens rejse som billedsekvens med Ken Burns */
function lysrejseSekvens(next){
  /* Tider afstemt efter felt.mp3 (30,04 sek.). Sekvensen slutter 600 ms
     efter sidste slide, saa 4200 + 4 gange 5300 + 4000 + 600 = 30,00 sek. */
  const slides = [
    { dur:4200, kicker:"8 minutter", title:"Lysets rejse", body:"Følg en solstråle hele vejen fra solen ned til Jorden" }
  ];
  LYSREJSE.tekster.forEach(function(t, i){
    slides.push({ dur:5300, src:LYSREJSE.fil, cap:t, rude:i });
  });
  slides.push({ dur:4000, kicker:"Derfor", title:"Du ser fortiden", body:"Solen du kigger på, er 8 minutter gammel" });
  billedSekvens(slides, MUSIK.planche, next);
}

function visDeling(r, grid, rang){
  const text = 'Solformørkelses-Missionen: En himmelhistorisk quiz\n'
    + rang + '\n' + r + '/' + RUNDE + '\n' + grid + '\nKan du slå mig? ' + location.href;
  const eText = encodeURIComponent(text);

  modal.className = 'share-modal';
  modal.innerHTML = '<div class="share-box">'
    + '<h3>Del dit resultat</h3>'
    + '<div class="share-list">'
    + '<a class="share-btn" href="https://twitter.com/intent/tweet?text='+eText+'" target="_blank" rel="noopener"><span class="ico x">X</span>X</a>'
    + '<a class="share-btn" href="https://wa.me/?text='+eText+'" target="_blank" rel="noopener"><span class="ico wa">\u2706</span>WhatsApp</a>'
    + '<a class="share-btn" href="sms:?&body='+eText+'"><span class="ico sms">\u2709</span>SMS</a>'
    + '<button class="share-btn" id="share-copy"><span class="ico cp">\u2398</span>Kopiér resultat</button>'
    + '</div>'
    + '<button class="share-close" id="share-close">Luk</button>'
    + '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if(e.target === modal) modal.remove(); });
  document.getElementById('share-close').onclick = function(){ modal.remove(); };
  document.getElementById('share-copy').onclick = function(){
    navigator.clipboard.writeText(text).then(function(){
      document.getElementById('share-copy').innerHTML = '<span class="ico cp">\u2713</span>Kopieret';
    });
  };
}

        + '<div class="nedtael">'
        + '<div><div class="t">'+Math.floor(s/86400)+'</div><div class="l">DAGE</div></div>'
        + '<div><div class="t">'+Math.floor(s%86400/3600)+'</div><div class="l">TIMER</div></div>'
        + '<div><div class="t">'+Math.floor(s%3600/60)+'</div><div class="l">MIN</div></div>'
        + '<div><div class="t">'+(s%60)+'</div><div class="l">SEK</div></div>'
        + '</div>'
        + '<p class="situation" style="text-align:center;font-size:13.5px">til formørkelsen topper '+FAKTA.dato+' kl. '+FAKTA.maksimum+'</p>';
    } else if(nu < FAKTA.slutTid){
      boks.innerHTML = '<div class="rang" style="font-size:24px">Det sker lige nu</div>'
        + '<p class="situation" style="text-align:center;font-size:13.5px">Kig mod vest og nordvest, med solformørkelsesbriller på.</p>';
    } else if(nu < dagSlut){
      boks.innerHTML = '<div class="rang" style="font-size:24px">Det skete i aften</div>'
        + '<p class="situation" style="text-align:center;font-size:13.5px">Bliv ude lidt endnu. Stjerneskuddene fra Perseiderne topper i nat.</p>';
    } else {
      const dage = Math.floor((nu - FAKTA.maalTid)/86400000);
      boks.innerHTML = '<div class="rang" style="font-size:22px">Formørkelsen er overstået</div>'
        + '<p class="situation" style="text-align:center;font-size:13.5px">Det er <b>'+dage+'</b> '+(dage === 1 ? 'dag' : 'dage')+' siden den 12. august 2026.<br>Den næste lige så kraftige solformørkelse i Danmark er i <b>2048</b>.</p>';
    }
    setTimeout(opd, 1000);
  }
  opd();
}

/* Til test i konsollen: previewEnding(9) */
function previewEnding(fakeScore){
  state.rigtige = fakeScore;
  state.history = [];
  for(let i=0;i<RUNDE;i++) state.history.push(i < fakeScore);
  state.felt = { maane:true, ur:true, sikkerhed:true };
  ending();
}

forside();
